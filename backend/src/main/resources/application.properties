spring.application.name=minty-code
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/minty}
spring.datasource.username=${DATABASE_USERNAME:${POSTGRES_USER:minty}}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD:minty-local-development}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
agent.python=${AGENT_PYTHON:python}
agent.worker=${AGENT_WORKER:../worker.py}
agent.workspaces=${AGENT_WORKSPACES:../data/workspaces}
agent.api-key=${ANTHROPIC_API_KEY:}
agent.base-url=${ANTHROPIC_BASE_URL:}
agent.model=${MODEL_ID:claude-sonnet-4-6}
agent.max-steps=${AGENT_MAX_STEPS:24}
agent.timeout-seconds=${AGENT_TIMEOUT_SECONDS:600}
agent.max-concurrent-runs=${AGENT_MAX_CONCURRENT_RUNS:2}
agent.allow-shell=${AGENT_ALLOW_SHELL:false}
logging.level.org.hibernate.orm.deprecation=ERROR
