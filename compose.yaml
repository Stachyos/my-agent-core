name: minty-code

services:
  db:
    image: postgres:14.10
    environment:
      POSTGRES_DB: minty
      POSTGRES_USER: minty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minty-local-development}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minty -d minty"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/minty
      SPRING_DATASOURCE_USERNAME: minty
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-minty-local-development}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      MODEL_ID: ${MODEL_ID:-claude-sonnet-4-6}
      AGENT_PYTHON: python3
      AGENT_WORKER: /app/worker.py
      AGENT_WORKSPACES: /app/data/workspaces
      AGENT_ALLOW_SHELL: ${AGENT_ALLOW_SHELL:-false}
      AGENT_ALLOWED_ORIGINS: http://127.0.0.1:${WEB_PORT:-5173},http://localhost:${WEB_PORT:-5173}
    volumes:
      - agent-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/status"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  agent-data:
